name: Twister release configuration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Refuse unconfigured release updates
        run: |
          python3 - <<'PYCODE'
          import plistlib
          from pathlib import Path
          info = plistlib.loads(Path('Configuration/Updates.public.plist').read_bytes())
          if info.get('Enabled', True) is False:
              print('::notice::Twister updates are disabled until an independent signing key and feed are configured.')
              raise SystemExit(0)
          assert info.get('PublicRepository') == 'baypeanut/twister'
          PYCODE
